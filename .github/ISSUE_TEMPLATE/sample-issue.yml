name: Issue with a repository sample
description: Report a reproducible problem with a specific sample in this repository.
title: "[Sample issue]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for an issue with a specific sample in this repository.

        For general SharePoint, SharePoint Copilot Apps, or SharePoint Framework issues, use the [sp-dev-docs issue tracker](https://github.com/SharePoint/sp-dev-docs/issues).

  - type: input
    id: sample
    attributes:
      label: Sample
      description: Which sample is affected? Provide its folder name or a link to the sample.
      placeholder: samples/sample-folder-name
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Install or configure...
        2. Run...
        3. Select...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact error messages where applicable.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment details
      description: Include relevant versions, operating system, browser, tenant type, and other setup details.
      placeholder: |
        - Sample version or commit:
        - Node.js version:
        - Operating system:
        - Browser:
        - Microsoft 365 tenant type:
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other details that may help diagnose the issue. Remove sensitive information first.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I confirmed that this issue is specific to a sample in this repository.
          required: true
        - label: I searched the existing issues for a duplicate.
          required: true
