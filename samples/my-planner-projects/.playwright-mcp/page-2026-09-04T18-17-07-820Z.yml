    - main [ref=f8e81]:
      - heading "Use templates to get started with Planner Agent" [level=1] [ref=f8e82]
      - region "L_AppliesTo_RoleDescription" [ref=f8e83]:
        - group [ref=f8e85]:
          - generic "Applies To" [ref=f8e86] [cursor=pointer]
      - generic [ref=f8e87]:
        - paragraph [ref=f8e88]: Microsoft Planner offers a set of ready-made Planner Agent templates to provide you with a head start for creating a new plan and interacting with the Planner Agent. The templates support a range of possible plan types and have a set of tasks that the Planner Agent can help complete.
        - generic [ref=f8e89]:
          - paragraph [ref=f8e90]: Note
          - paragraph [ref=f8e91]:
            - text: Planner Agent is currently rolling out to customers. Learn more about it in
            - link "Frequently asked questions about Planner Agent" [ref=f8e92] [cursor=pointer]:
              - /url: frequently-asked-questions-about-planner-agent
            - text: .
        - heading "Why use a pre-made template?" [level=2] [ref=f8e93]
        - paragraph [ref=f8e94]: If you're new to Planner Agent, using a template is a great way to explore its features and learn how to interact with it effectively.
        - paragraph [ref=f8e95]: If you're new to Planner Agent, using a template is a great way to explore its features and learn how to interact with it effectively. Additionally, if your intended plan falls into one of the categories of the pre-made templates, using a template gives you a head start and reduces the struggles that can come with starting from a blank page.
        - heading "Create a new plan from a template" [level=2] [ref=f8e96]
        - list [ref=f8e97]:
          - listitem [ref=f8e98]:
            - text: Open
            - strong [ref=f8e99]: Planner in Teams
            - text: .
          - listitem [ref=f8e100]:
            - text: Select
            - strong [ref=f8e101]: + New plan
            - text: in the top left of the page.
          - listitem [ref=f8e102]:
            - text: Scroll down to
            - strong [ref=f8e103]: Planner agent
            - text: templates.
          - listitem [ref=f8e104]:
            - text: Select any
            - strong [ref=f8e105]: Planner agent
            - text: template that meets your needs. For example, select
            - strong [ref=f8e106]: Research Report
            - text: under the
            - strong [ref=f8e107]: Planner agent Templates
            - text: header for a plan to write a research report on any topic.
          - listitem [ref=f8e108]: Review the template to ensure it meets your needs.
          - listitem [ref=f8e109]:
            - text: Select
            - strong [ref=f8e110]: Use template
            - text: .
          - listitem [ref=f8e111]: Give your plan a name and select the relevant group to add to the plan
          - listitem [ref=f8e112]:
            - text: Select
            - strong [ref=f8e113]: Create
            - text: .
        - heading "Edit the template to meet your needs" [level=2] [ref=f8e114]
        - paragraph [ref=f8e115]: "After creating a templated plan, you can edit the plan goal and add files to help the Planner Agent properly execute tasks. Let's look at an example:"
        - paragraph [ref=f8e116]: "Oscar is a product manager at an EV company. He is conducting market research on the EV market. He is using the Project Manager Research template, and to edit the template to meet his need, Oscar completes the follow steps:"
        - list [ref=f8e117]:
          - listitem [ref=f8e118]: On the Goals view, edit the template goal "Complete a research report on the life cycle of a great white shark" by replacing "life cycle of a great white shark" with "EV market."
          - listitem [ref=f8e119]:
            - text: Select
            - strong [ref=f8e120]: Add files for better results
            - text: .
          - listitem [ref=f8e121]:
            - text: Choose relevant documentation. For his scenario, Oscar selects Contoso Market Research.docx.
            - link "Learn more about adding files for context." [ref=f8e122] [cursor=pointer]:
              - /url: add-resources-as-context-for-planner-agent
        - generic [ref=f8e123]:
          - paragraph [ref=f8e124]: Tip
          - paragraph [ref=f8e125]: To generate tasks for a goal, ensure that no tasks are currently associated with that goal. Task generation applies only to goals without existing tasks.
        - paragraph [ref=f8e126]:
          - text: With this personalization made, Oscar can now assign tasks to the Planner Agent to start execution on the plan.
          - link "Learn more about executing tasks with the Planner agent." [ref=f8e127] [cursor=pointer]:
            - /url: execute-tasks-with-planner-agent
