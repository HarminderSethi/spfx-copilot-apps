<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zava AI Portfolio - Inline UX Review</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e9edf2; color: #1f1f1f; font-family: "Segoe UI", sans-serif; }
    .review-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 58px; padding: 10px 18px; border-bottom: 1px solid #c7c7c7; background: #fff; }
    .review-bar strong { margin-right: auto; }
    .review-bar label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
    .review-bar select, .review-bar button { min-height: 34px; border: 1px solid #8a8886; border-radius: 4px; background: #fff; padding: 5px 9px; }
    .stage { min-height: calc(100vh - 58px); display: flex; justify-content: center; align-items: flex-start; padding: 42px 18px; background-image: linear-gradient(90deg, rgba(15,108,189,.04) 1px, transparent 1px), linear-gradient(rgba(15,108,189,.04) 1px, transparent 1px); background-size: 24px 24px; }
    .host { width: min(100%, 760px); }
    .host.narrow { width: 340px; }
    .host.wide { width: 980px; }
    .host.keynote { width: 1360px; }
    body.dark { background: #181818; color: #fff; }
    body.dark .review-bar { border-color: #484644; background: #242424; }
    body.dark .review-bar select, body.dark .review-bar button { color: #fff; border-color: #797775; background: #323130; }
    body.dark .stage { background-color: #111; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./review.js"></script>
</body>
</html>
